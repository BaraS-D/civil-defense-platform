name: تحديث بيانات الأقمار الصناعية

on:
  schedule:
    - cron: "0 */3 * * *"   # كل 3 ساعات (بتوقيت UTC)
  workflow_dispatch: {}      # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: سحب الحرائق (FIRMS)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/fetch_fires.py
        continue-on-error: true

      - name: سحب الغازات (Sentinel-5P)
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: python scripts/fetch_s5p.py
        continue-on-error: true

      - name: حفظ التغييرات
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "تحديث البيانات" && git push)
